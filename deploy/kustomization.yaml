# kubectl apply -k deploy   (then one RoleBinding per tenant: see tenant-rolebinding.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
configMapGenerator:
  - name: secret-sync-policy
    namespace: secret-sync
    files:
      - policy.toml
    options:
      disableNameSuffixHash: false # a policy change rolls the Deployment (new hash → new pod)
images:
  - name: ghcr.io/ngems1/k8s-secret-sync-operator
    newTag: "1.0.0"
