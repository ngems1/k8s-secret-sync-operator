# In-cluster fakes: Moto (AWS) and Lowkey Vault (Azure Key Vault). Test only.
apiVersion: v1
kind: Namespace
metadata: {name: fakes}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: moto, namespace: fakes}
spec:
  selector: {matchLabels: {app: moto}}
  template:
    metadata: {labels: {app: moto}}
    spec:
      # No legacy service-link env vars: a Service named 'moto' would inject MOTO_PORT=tcp://...
      # into the pod, and Moto reads MOTO_PORT as its port number (crash, found by the e2e).
      enableServiceLinks: false
      containers:
        - name: moto
          image: motoserver/moto:5.2.5
          ports: [{containerPort: 5000}]
          readinessProbe: {httpGet: {path: /moto-api/, port: 5000}}
---
apiVersion: v1
kind: Service
metadata: {name: moto, namespace: fakes}
spec:
  selector: {app: moto}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lowkey-vault, namespace: fakes}
spec:
  selector: {matchLabels: {app: lowkey-vault}}
  template:
    metadata: {labels: {app: lowkey-vault}}
    spec:
      # No legacy service-link env vars: a Service named 'moto' would inject MOTO_PORT=tcp://...
      # into the pod, and Moto reads MOTO_PORT as its port number (crash, found by the e2e).
      enableServiceLinks: false
      containers:
        - name: lowkey
          image: nagyesta/lowkey-vault:7.4.0
          env:
            - name: LOWKEY_ARGS
              value: "--server.port=8443 --LOWKEY_VAULT_ALIASES=localhost=lowkey-vault.fakes.svc.cluster.local:<port>"
          ports: [{containerPort: 8443}]
          readinessProbe: {tcpSocket: {port: 8443}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: lowkey-vault, namespace: fakes}
spec:
  selector: {app: lowkey-vault}
  ports: [{port: 8443, targetPort: 8443}]
